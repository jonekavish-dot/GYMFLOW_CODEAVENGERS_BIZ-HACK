name: CI

# Backend tests run against both SQLite and a real PostgreSQL (production is Postgres, e.g. Neon),
# and the frontend must build. There is no deploy step: hosting is up to wherever you run the API.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gymflow_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Tests (SQLite)
        run: python -m pytest -q
      - name: Tests (PostgreSQL)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gymflow_test
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
