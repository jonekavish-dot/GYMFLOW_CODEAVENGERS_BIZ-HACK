<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sign In</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230d0f0e'/><g fill='%2339e56a'><rect x='14' y='34' width='12' height='32' rx='3'/><rect x='74' y='34' width='12' height='32' rx='3'/><rect x='28' y='40' width='8' height='20' rx='2'/><rect x='64' y='40' width='8' height='20' rx='2'/><rect x='36' y='46' width='28' height='8' rx='2'/></g></svg>">
  <meta name="theme-color" content="#0b0e0c">
  <meta name="description" content="GymFlow — gym membership, class booking, attendance and revenue.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GymFlow">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/auth.css">
  <link rel="stylesheet" href="assets/css/ported.css">
  <link rel="stylesheet" href="assets/css/mobile.css">
</head>
<body>
  <div class="lockscreen">
    <main class="lock-box">
      <svg class="lock-mark" width="60" height="60" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect width="100" height="100" rx="22" fill="#0d0f0e" stroke="#39e56a" stroke-width="3"/>
        <g fill="#39e56a"><rect x="14" y="34" width="12" height="32" rx="3"/><rect x="74" y="34" width="12" height="32" rx="3"/><rect x="28" y="40" width="8" height="20" rx="2"/><rect x="64" y="40" width="8" height="20" rx="2"/><rect x="36" y="46" width="28" height="8" rx="2"/></g>
      </svg>
      <div class="lock-logo" data-app-name></div>
      <div class="lock-sub" data-app-tagline></div>

      <div id="conn" class="conn">Checking Firebase…</div>
      <p id="login-err" class="lock-err" role="alert"></p>

      <form id="login-form" autocomplete="on" onsubmit="return false">
        <label>Email Address <input type="email" name="email" required autocomplete="username" placeholder="you@example.com"></label>
        <label>Password <input type="password" name="password" required autocomplete="current-password" placeholder="Your password"></label>
        <button type="submit" class="lock-btn">🔥 Sign In</button>
        <button type="button" id="forgot" class="lock-link">Forgot password?</button>
      </form>

      <form id="setup-form" class="setup-box" hidden onsubmit="return false">
        <h3>⚡ First-time setup</h3>
        <p>No admin exists yet. Create the admin account — this form disappears afterwards.</p>
        <label>Name <input name="fullName" required placeholder="Your name"></label>
        <label>Email Address <input type="email" name="email" required autocomplete="username"></label>
        <label>Password <input type="password" name="password" required minlength="6" autocomplete="new-password"></label>
        <button type="submit" class="lock-btn">Create Admin Account</button>
      </form>

      <div class="lock-hint">
        ℹ️ <span class="hl">Members:</span> your login is created by an admin when you're registered. Admins and members use this same page — you're taken to the right portal automatically.
      </div>
      <button type="button" id="install-app" class="install-cta" hidden>⬇ Install GymFlow as an app</button>
    </main>
  </div>
  <script type="module" src="js/entries/login.js"></script>
</body>
</html>
